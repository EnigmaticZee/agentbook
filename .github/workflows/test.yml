name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Kit scenarios
        run: bash test/run.sh
      - name: CLI
        run: |
          go vet ./...
          go test ./...
          go build ./cmd/agentbook
