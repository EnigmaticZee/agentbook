# Agentbook settings for {{PROJECT}}. Read by kit/*.sh (plain shell variables).

PROJECT_NAME="{{PROJECT}}"

# Stage: local | private | public  (where the CODE repo is; the handbook is always private)
STAGE="local"

# single = ONE private repo: this workspace holds the handbook AND the code (code/ is a normal folder).
#          Code and handbook changes are committed separately, so kit/go-public.sh can later give the
#          code its own repo (for example to go public) with a clean history.
# split  = code/ is its own repo (public or private) inside this workspace, ignored by it, fetched by
#          setup from CODE_REMOTE.
LAYOUT="single"

# Folder (inside this workspace) that holds the code.
CODE_DIR="code"

# Remotes (empty while the project is local only). Split layout: setup clones CODE_REMOTE into
# CODE_DIR when the code is missing, which is how a fresh clone of this workspace gets its code.
CODE_REMOTE=""
HANDBOOK_REMOTE=""

# Commit identity for both repos
GIT_NAME=""
GIT_EMAIL=""

# Optional guard, off by default: yes = code pushes are blocked if they contain AI tool traces (tool
# names, "generated with" or co-author lines, AI config folders) or any identity but GIT_EMAIL, and
# AI tool folders inside the code are kept out of git. For people who want their published code to
# show only their own name. no = no such checks.
HIDE_AI_TRACES="no"

# Agent entry files. Each is a link to AGENTS.md, both in this workspace (committed here, private)
# and inside the code folder (local only, hidden from the code repo). Most agents read AGENTS.md;
# add others for agents that read a different name (Claude Code: CLAUDE.md, Gemini CLI: GEMINI.md).
AGENT_FILES="AGENTS.md CLAUDE.md GEMINI.md"

# One command that runs every test, run from inside the code folder.
TEST_CMD=""

# Commands that must exist on the computer, and one command that installs the rest.
REQUIRE_CMDS="git"
INSTALL_CMD=""
# Steps that can't be scripted (shown after setup), for example "Install Xcode from the App Store".
MANUAL_SETUP=""
