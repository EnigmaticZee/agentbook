<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="While private: one repo holds the handbook and code/. Once public: only the code's own history moves to a public repo; the handbook stays private and fetches it.">
  <rect width="1200" height="320" rx="16" fill="#14130F"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#2E2C25"/>
  <g transform="translate(40 40)">
    <rect width="520" height="240" rx="6" fill="#1D1C17" stroke="#2E2C25"/>
    <rect x="24" y="24" width="72" height="22" rx="4" fill="none" stroke="#FF8E68"/>
    <text x="60" y="39" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#FF8E68" text-anchor="middle" letter-spacing="0.6">PRIVATE</text>
    <text x="108" y="41" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#EEE9DC">my-app</text>
    <text x="180" y="40" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7A7466">what you clone and open</text>
    <text x="28" y="92" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">├──</tspan> <tspan fill="#EEE9DC" font-weight="600">AGENTS.md</tspan><tspan x="238" fill="#7A7466">rules every agent reads first</tspan></text><text x="28" y="118" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">├──</tspan> <tspan fill="#EEE9DC" font-weight="600">STATUS.md</tspan><tspan x="238" fill="#7A7466">where things stand, next step</tspan></text><text x="28" y="144" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">├──</tspan> <tspan fill="#EEE9DC" font-weight="600">DECISIONS.md</tspan><tspan x="238" fill="#7A7466">every decision and why</tspan></text><text x="28" y="170" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">├──</tspan> <tspan fill="#EEE9DC" font-weight="600">history/sessions/</tspan><tspan x="238" fill="#7A7466">every question and answer</tspan></text><text x="28" y="196" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">├──</tspan> <tspan fill="#EEE9DC" font-weight="600">kit/</tspan><tspan x="238" fill="#7A7466">sync · check · find · hooks</tspan></text><text x="28" y="222" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">└──</tspan> <tspan fill="#FF8E68" font-weight="600">code/</tspan><tspan x="238" fill="#7A7466">your code</tspan></text>
  </g>
  <g transform="translate(588 160)">
    <text x="50" y="-14" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7A7466" text-anchor="middle" letter-spacing="0.8">GO PUBLIC</text>
    <path d="M4 0h90M84 -8l10 8-10 8" fill="none" stroke="#FF7A50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(712 80)">
    <rect width="448" height="160" rx="6" fill="#1D1C17" stroke="#2E2C25"/>
    <rect x="24" y="24" width="64" height="22" rx="4" fill="none" stroke="#6CC497"/>
    <text x="56" y="39" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6CC497" text-anchor="middle" letter-spacing="0.6">PUBLIC</text>
    <text x="100" y="41" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#EEE9DC">my-app</text>
    <text x="172" y="40" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7A7466">code only</text>
    <text x="28" y="80" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">├──</tspan> <tspan fill="#FF8E68" font-weight="600">src/  README  LICENSE</tspan></text>
    <text x="28" y="106" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14"><tspan fill="#403D33">└──</tspan> <tspan fill="#7A7466">only the code's own commits</tspan></text>
    <text x="28" y="138" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#A39D8C">The handbook stays private as <tspan font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#EEE9DC">my-app-handbook</tspan>.</text>
  </g>
</svg>
