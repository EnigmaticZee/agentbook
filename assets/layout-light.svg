<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="While private: one repo holds the handbook and code/. Once public: only the code's own history moves to a public repo; the handbook stays private and fetches it.">
  <rect width="1200" height="380" rx="28" fill="#F4F3FA"/>
  <g transform="translate(40 30)" filter="url(#s)">
    <rect width="440" height="320" rx="22" fill="#FFFFFF" stroke="#E1E1EC"/>
    <circle cx="30" cy="34" r="6" fill="#6B4EF2"/>
    <text x="46" y="41" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#14152A">my-app</text>
    <text x="126" y="40" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6">private repo · what you clone and open</text>
    <rect x="20" y="64" width="400" height="34" rx="10" fill="#E9E8F3"/>
      <text x="36" y="86" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#14152A">AGENTS.md</text>
      <text x="404" y="86" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">rules every agent reads first</text><rect x="20" y="106" width="400" height="34" rx="10" fill="#E9E8F3"/>
      <text x="36" y="128" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#14152A">STATUS.md</text>
      <text x="404" y="128" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">where things stand, next step</text><rect x="20" y="148" width="400" height="34" rx="10" fill="#E9E8F3"/>
      <text x="36" y="170" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#14152A">DECISIONS.md</text>
      <text x="404" y="170" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">every decision and why</text><rect x="20" y="190" width="400" height="34" rx="10" fill="#E9E8F3"/>
      <text x="36" y="212" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#14152A">history/sessions/</text>
      <text x="404" y="212" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">every question and answer</text><rect x="20" y="232" width="400" height="34" rx="10" fill="#E9E8F3"/>
      <text x="36" y="254" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#14152A">kit/</text>
      <text x="404" y="254" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">sync · check · find · hooks</text><rect x="20" y="274" width="400" height="34" rx="10" fill="#ECE8FF"/>
      <text x="36" y="296" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#6B4EF2">code/</text>
      <text x="404" y="296" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">your code</text>
  </g>
  <g transform="translate(510 170)">
    <text x="85" y="-14" font-family="'Instrument Serif','Iowan Old Style','Palatino','Georgia',serif" font-style="italic" font-size="21" fill="#50566E" text-anchor="middle">when you go public</text>
    <path d="M10 6 H160 M148 -4 l12 10 -12 10" fill="none" stroke="#F0A030" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(700 82)">
    <rect width="460" height="216" rx="22" fill="#FFFFFF" stroke="#E1E1EC"/>
    <circle cx="30" cy="34" r="6" fill="#0F7A55"/>
    <text x="46" y="41" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#14152A">my-app</text>
    <text x="126" y="40" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6">public repo · code only</text>
    <rect x="20" y="64" width="420" height="34" rx="10" fill="#ECE8FF"/>
      <text x="36" y="86" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#6B4EF2">src/ · README · LICENSE</text>
      <text x="424" y="86" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">the code's own commits only</text><rect x="20" y="106" width="420" height="34" rx="10" fill="none" stroke="#E1E1EC" stroke-dasharray="5 5"/>
      <text x="36" y="128" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#8A90A6">no notes</text>
      <text x="424" y="128" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8A90A6" text-anchor="end">the handbook never leaves</text>
    <text x="22" y="176" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#50566E">The handbook stays private as <tspan font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#6B4EF2">my-app-handbook</tspan></text>
    <text x="22" y="196" font-family="'Bricolage Grotesque','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#50566E">and fetches the public code into <tspan font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#6B4EF2">code/</tspan>.</text>
  </g>
  <defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0C0F22" flood-opacity="0.12"/></filter></defs>
</svg>
