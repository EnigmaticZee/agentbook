version: 2
project_name: agentbook
builds:
  - main: ./cmd/agentbook
    binary: agentbook
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w"]
archives:
  - name_template: "agentbook_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
brews:
  - name: agentbook
    repository:
      owner: EnigmaticZee
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    homepage: https://enigmaticzee.github.io/agentbook
    description: "Your project remembers everything: a handbook any coding agent can pick up on any computer"
    license: MIT
    dependencies:
      - name: git
    test: |
      system "#{bin}/agentbook", "version"
